    <!-- FAQPage Schema (mirrors visible FAQ on the page) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What areas of Texas do you serve?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our two offices are in Temple, TX (Bell County) and Corpus Christi, TX (Nueces County). We write policies for clients throughout Texas."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to get a quote?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most quote requests take under 60 seconds to start online. Our team typically responds within 24 hours — often the same business day."
          }
        },
        {
          "@type": "Question",
          "name": "What types of insurance do you offer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Auto, home, life, business, renters, flood and storm, umbrella, motorcycle, boat, and specialty coverage for RVs and recreational vehicles."
          }
        },
        {
          "@type": "Question",
          "name": "Can you bundle auto and home for a discount?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Bundling auto and home is one of the fastest ways to lower your annual premium. Ask for a bundled quote and we will run the numbers both ways."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need flood insurance in Texas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Standard home policies do not cover flood. Anywhere along the coast, in a designated flood zone, or near a flood-prone area, separate NFIP or private flood coverage is essential."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need TWIA or windstorm insurance in Corpus Christi?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "If your property is in one of the 14 Texas first-tier coastal counties (Nueces County included), your standard homeowners policy almost certainly excludes wind and hail — which usually means buying a separate TWIA windstorm policy. Here's our edge: in many coastal ZIP codes we can write wind-included homeowners coverage, with windstorm built right into the policy, often at a significantly lower cost than standalone TWIA. It's one of the biggest differentiators we offer on the coast. We'll put both options side-by-side so you can see the savings."
          }
        },
        {
          "@type": "Question",
          "name": "When should I prep my coastal insurance for hurricane season?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Before June 1. NFIP flood policies have a 30-day waiting period, and TWIA closes binding entirely once a named storm enters the Gulf. The right window to review limits, deductibles, and gaps in your three-policy stack (home + wind + flood) is April-May, not when the cone shows up."
          }
        },
        {
          "@type": "Question",
          "name": "How does my roof age affect my coastal Texas insurance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Roof age is the single biggest underwriting factor on a coastal homeowners policy. Most carriers quietly switch roofs over 15 years to Actual Cash Value (ACV) — meaning depreciation gets subtracted from your claim check — or hit you with higher premiums or non-renewal, and most homeowners do not find out until they file. This is where we stand apart: we write home policies with full roof replacement coverage (Replacement Cost, not ACV) that very few carriers in coastal Texas still offer. If your roof has any age on it, ask us — it can be the difference between a full new roof and a fraction of one after the next storm."
          }
        },
        {
          "@type": "Question",
          "name": "How does the quote process work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Tell us about you (60 seconds), we compare options on your behalf, then you choose the coverage that fits. No obligation to bind."
          }
        },
        {
          "@type": "Question",
          "name": "Are you licensed in Texas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Maxwell Financial Group is a licensed Texas insurance agency, TDI License #3260189."
          }
        },
        {
          "@type": "Question",
          "name": "How do I file a claim?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Call your office directly: Temple (254) 294-3311 or Corpus Christi (361) 317-7044. We will walk you through the claim process step by step."
          }
        }
